<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Explorer | Kəşf Et</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo"><i class="bi bi-globe-americas"> </i>World<span>Explorer</span></div>


        <div class="links">
            <div class="ai-container">
                <button class="ai-btn"> <i class="bi bi-robot"></i></button>
            </div>
            <a href="#" class="active mainPage">Ana Səhifə</a>
            <a href="#" class="openFavSidebar">Favoritlər</a>
            <div class="log-in">
                <button class="log-in-btn"> <span> Log in</span>
                    <i class="bi bi-person-plus normal-icon"></i>
                    <i class="bi bi-person-plus-fill hover-icon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="ai-search-container hidden">
        <div class="ai-input-wrapper">
            <input type="text" class="ai-input" placeholder="Xəyalındakı ölkəni təsvir et">
            <button class="ai-send-btn">
                <i class="bi bi-send"></i>
            </button>
        </div>
    </div>

    <header class="header">
        <div class="header-content">
            <h1>Dünyanı Bir Toxunuşla Kəşf Et</h1>
            <p>Minlərlə ölkə, mədəniyyət və tarix səni gözləyir.</p>
            <div class="search-box">
                <input type="text" class="input-country" placeholder="Ölkə adı yazın...">
                <button class="search-btn">Kəşf Et</button>
            </div>
            <div class="error"></div>
        </div>
    </header>

    <main class="map-container">
        <div class="map-wrapper">
            <object type="image/svg+xml" data="worldmap.svg"></object>
        </div>
    </main>
    <div class="country-sidebar">
        <div class="sidebar-header">
            <h2 class="country-name">Ölkə Məlumatı</h2>

            <button class="close-sidebar">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="sidebar-info">
            <img class="country-flag" src="" alt="Bayraq">
            <div class="info-item">
                <strong>Paytaxt:</strong> <span class="capital">-</span>
            </div>
            <div class="info-item">
                <strong>Əhali:</strong> <span class="population">-</span>
            </div>
            <div class="info-item">
                <strong>Valyuta:</strong> <span class="currency">-</span>
            </div>
            <div class="info-item">
                <strong>Region:</strong> <span class="region">-</span>
            </div>
            <div class="info-item">
                <strong>Area:</strong> <span class="area">-</span>
            </div>
            <div class="weather-box">
            </div>
            <div class="fav-box">
                <button class="fav-button">
                    <i class="bi bi-heart heart-icon "></i>
                </button>
            </div>
        </div>

    </div>
    <div class="fav-sidebar">
        <div class="fav-sidebar-header">
            <h2><i class="bi bi-heart-fill fav-bi"></i> <span class="favhead"> Favorit Ölkələr</span></h2>
            <button class="closeFavBtn">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="favList">

        </div>
    </div>

    <div class="ai-sidebar">
        <div class="ai-sidebar-header">
            <h2><i class="bi bi-robot side-robot"></i> <span class="aiHead">AI Tövsiyələri</span></h2>
            <button class="closeAiBtn"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="aiList">
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 World Explorer. Bütün hüquqlar qorunur.</p>
    </footer>

    <button  class="theme-btn toggle">
        <i class="bi bi-moon-stars theme-icon"></i>
    </button>

    <script src="./script.js"> </script>
</body>

</html>
